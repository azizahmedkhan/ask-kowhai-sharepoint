 sans-serif" font-size="17" font-weight="600">Registration/permission shown; consent: verify</text><rect x="645" y="2190" width="550" height="305" fill="#F8FAFC" stroke="#D4DFE6" stroke-width="2" rx="14" /><text x="665" y="2228" fill="#152B3C" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600">SharePoint admin center / Apps</text><text x="665" y="2273" fill="#546778" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">API access: SPFx Graph User.Read request</text><text x="665" y="2309" fill="#546778" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">App Catalog: upload and enable .sppkg</text><text x="665" y="2345" fill="#546778" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">API approval and deployment are separate</text><text x="665" y="2381" fill="#546778" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Target: SPFx Graph grant and package</text><rect x="660" y="2435" width="520" height="44" fill="#EFF4FA" stroke="#EFF4FA" stroke-width="2" rx="6" /><text x="670" y="2463" fill="#2563EB" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600">Prior visit reported; current grants: verify</text><rect x="1220" y="2190" width="550" height="305" fill="#F8FAFC" stroke="#D4DFE6" stroke-width="2" rx="14" /><text x="1240" y="2228" fill="#152B3C" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600">FrontLine site administration</text><text x="1240" y="2273" fill="#546778" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Site contents: install/update the app</text><text x="1240" y="2309" fill="#546778" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Custom action: ID and runtime properties</text><text x="1240" y="2345" fill="#546778" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">SiteAssets icon; user/site permissions</text><text x="1240" y="2381" fill="#546778" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Target: one configured extension instance</text><rect x="1235" y="2435" width="520" height="44" fill="#EFF4FA" stroke="#EFF4FA" stroke-width="2" rx="6" /><text x="1245" y="2463" fill="#2563EB" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600">Latest installation/properties: verify</text><rect x="1795" y="2190" width="550" height="305" fill="#F8FAFC" stroke="#D4DFE6" stroke-width="2" rx="14" /><text x="1815" y="2228" fill="#152B3C" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600">VS Code, terminal and Edge</text><text x="1815" y="2273" fill="#546778" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Heft HTTPS server on localhost:4321</text><text x="1815" y="2309" fill="#546778" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">npm run debug:url supplies customActions</text><text x="1815" y="2345" fill="#546778" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Edge: debug scripts + local-network access</text><text x="1815" y="2381" fill="#546778" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Local bundle runs on the SharePoint page</text><rect x="1810" y="2435" width="520" height="44" fill="#EFF4FA" stroke="#EFF4FA" stroke-width="2" rx="6" /><text x="1820" y="2463" fill="#2563EB" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600">Helper/build/tests present; live reply: verify</text><text x="70" y="2550" fill="#152B3C" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600">Access controls are separate: site access → icon group → app consent → agent access → document/tool permissions.</text><text x="70" y="2592" fill="#546778" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400">Default environment: the pilot group is checked